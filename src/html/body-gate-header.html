<!--! Naked Brain - markup: password gate, author name, header, app tabs, gallery. Edit here, then run: python build.py -->

<!-- PASSWORD GATE -->
<div id="passwordGate" class="hidden" role="dialog" aria-modal="true" aria-label="App login">
  <div class="pw-card">
    <div style="text-align:center">
      <img src="icon-192.png?v=4" alt="" style="width:64px;height:64px;margin:0 auto;display:block">
      <div style="font-size:var(--text-lg);font-weight:700;margin-top:var(--space-2)">Naked Brain</div>
      <div style="font-size:var(--text-sm);color:var(--text-muted);margin-top:var(--space-1)">Enter your team password to continue</div>
    </div>
    <div class="pw-input-wrap">
      <input id="appPasswordInput" type="password" placeholder="Password" autocomplete="current-password"
        onkeydown="if(event.key==='Enter') tryUnlockApp()">
      <button class="pw-eye-btn" onclick="togglePwVisibility()" aria-label="Show / hide password"><i data-ic="eye"></i></button>
    </div>
    <div id="appPasswordError" class="pw-error" style="display:none"></div>
    <button class="pw-unlock-btn" id="unlockBtn" onclick="tryUnlockApp()">Unlock</button>
    <!-- a way out: the gate covers the whole app, and Unlock needs both the password and the network -->
    <button type="button" id="pwGateBack" onclick="hidePasswordGate(); if (typeof setAppMode === 'function') setAppMode('sop');"
      style="min-height:44px;border-radius:var(--radius-full);font-weight:600;color:var(--text-muted)">Back to Tasks</button>
  </div>
</div>

<!-- AUTHOR NAME: mandatory; asked after the first login and whenever it is missing -->
<div id="authorGate" class="hidden" role="dialog" aria-modal="true" aria-labelledby="authorGateTitle">
  <div class="pw-card">
    <div style="text-align:center">
      <img src="icon-192.png?v=4" alt="" style="width:56px;height:56px;margin:0 auto var(--space-2);display:block">
      <div id="authorGateTitle" style="font-size:var(--text-lg);font-weight:700">What's your name?</div>
      <div style="font-size:var(--text-sm);color:var(--text-muted);margin-top:var(--space-1)">It goes on every note you send and every checklist you complete.</div>
    </div>
    <div class="pw-input-wrap">
      <input id="authorGateInput" type="text" placeholder="Your name" autocomplete="name" autocapitalize="words" spellcheck="false" aria-label="Your name">
    </div>
    <div id="authorGateError" class="pw-error" style="display:none">Please enter your name to continue.</div>
    <button class="pw-unlock-btn" id="authorGateSave">Continue</button>
    <button id="authorGateCancel" class="hidden">Cancel</button>
  </div>
</div>

<a href="#main-content" class="sr-only">Skip to content</a>

<!-- APP TABS: Tasks (procedures & checklists), Capture and Gallery (FarmBox mode only); the app opens on Tasks -->
<nav class="app-tabs" id="appTabs" role="tablist" aria-label="Sections">
  <button class="app-tab" role="tab" data-mode="sop">Tasks</button>
  <button class="app-tab" role="tab" data-mode="capture">Capture</button>
  <button class="app-tab" role="tab" data-mode="gallery">Gallery</button>
</nav>

<!-- GALLERY (0.11.144, FarmBox 0265): the farm's photos — take or choose, tag, send; the latest of the farm below.
     FarmBox mode only (body.src-cloud); the script is in the FarmBox part of the page (galleryOpen). -->
<section class="app-view" id="viewGallery" aria-label="Gallery">
  <div class="sop-bar">
    <div class="hdr-title">Gallery</div>
    <button id="gl-sync" class="btn-icon" aria-label="Refresh the gallery" title="Refresh the gallery">⟳</button>
  </div>
  <main class="sop-main" id="gl-main">
    <div id="gl-add"></div>
    <div id="gl-mine"></div>
    <div id="gl-farm"></div>
  </main>
</section>
